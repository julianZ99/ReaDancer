name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Syntax check
        run: luac5.4 -p Various/ReaDancer.lua

      - name: Run tests
        run: lua5.4 tests/run.lua
